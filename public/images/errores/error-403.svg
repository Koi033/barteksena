    <path d="M0 60 L0 10 Q0 0 10 0 Q20 0 20 10 L20 45 L25 10 Q25 0 35 0 Q45 0 45 10 L45 48 L50 12 Q50 2 60 2 Q70 2 70 12 L70 55 Q70 90 45 100 L10 100 Q-5 90 -5 65 Z"/>
