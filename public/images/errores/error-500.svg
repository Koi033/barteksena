<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots500" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1a1a1a"/>
    </pattern>
  </defs>

  <ellipse cx="330" cy="540" rx="230" ry="30" fill="url(#dots500)" opacity="0.5"/>

  <!-- mesa -->
  <path d="M90 520 L610 520 L580 545 L120 545 Z" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- charco derramado -->
  <path d="M120 500 Q170 485 220 505 Q260 520 300 505 Q330 495 310 520 L130 520 Z" fill="#1a1a1a" opacity="0.08" stroke="#1a1a1a" stroke-width="2"/>

  <!-- copa caida -->
  <g stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linejoin="round" transform="translate(230,470) rotate(90)">
    <path d="M0 0 L60 0 L30 70 Z"/>
    <line x1="30" y1="70" x2="30" y2="100"/>
  </g>
  <!-- fragmentos -->
  <g stroke="#1a1a1a" stroke-width="2.5" fill="none">
    <path d="M300 480 L320 470 L315 490 Z"/>
    <path d="M330 500 L345 495 L340 512 Z"/>
  </g>

  <!-- bartender -->
  <g stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M340 330 L500 330 L520 520 L320 520 Z" fill="#1a1a1a" opacity="0.06"/>
    <path d="M340 330 L500 330 L520 520 L320 520 Z"/>
    <path d="M405 322 L420 332 L435 322 L420 340 Z" fill="#1a1a1a"/>
    <!-- brazos en la cabeza, agobiado -->
    <path d="M345 340 L300 280 L330 255"/>
    <path d="M495 340 L530 275 L500 250"/>
    <!-- cabeza -->
    <circle cx="420" cy="270" r="55"/>
    <path d="M368 250 Q380 205 420 210 Q460 205 472 250 Q460 235 420 235 Q380 235 368 250 Z" fill="#1a1a1a"/>
    <!-- cejas caidas, agobiado -->
    <path d="M398 258 L414 265"/>
    <path d="M442 258 L426 265"/>
    <circle cx="404" cy="278" r="4" fill="#1a1a1a" stroke="none"/>
    <circle cx="436" cy="278" r="4" fill="#1a1a1a" stroke="none"/>
    <!-- boca preocupada -->
    <path d="M403 302 Q420 292 437 302"/>
  </g>

  <!-- chispas / caos alrededor de la cabeza -->
  <g stroke="#E8792A" stroke-width="4" stroke-linecap="round">
    <line x1="360" y1="190" x2="345" y2="170"/>
    <line x1="480" y1="190" x2="495" y2="170"/>
    <line x1="420" y1="175" x2="420" y2="150"/>
    <path d="M330 210 L315 205 L325 195" fill="none"/>
    <path d="M510 210 L525 205 L515 195" fill="none"/>
  </g>

  <!-- letrero 500 -->
  <g transform="translate(90,180) rotate(-6)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="65" y="40" font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#E8792A" text-anchor="middle">500</text>
  </g>
</svg>
