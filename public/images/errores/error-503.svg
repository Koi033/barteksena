<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots503" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1a1a1a"/>
    </pattern>
  </defs>

  <ellipse cx="340" cy="540" rx="230" ry="30" fill="url(#dots503)" opacity="0.5"/>

  <!-- persiana / reja de bar cerrado -->
  <g stroke="#1a1a1a" stroke-width="4" fill="none">
    <rect x="150" y="150" width="400" height="300" rx="6"/>
    <line x1="150" y1="185" x2="550" y2="185" stroke-width="2.5"/>
    <line x1="150" y1="220" x2="550" y2="220" stroke-width="2.5"/>
    <line x1="150" y1="255" x2="550" y2="255" stroke-width="2.5"/>
    <line x1="150" y1="290" x2="550" y2="290" stroke-width="2.5"/>
    <line x1="150" y1="325" x2="550" y2="325" stroke-width="2.5"/>
    <line x1="150" y1="360" x2="550" y2="360" stroke-width="2.5"/>
    <line x1="150" y1="395" x2="550" y2="395" stroke-width="2.5"/>
    <line x1="150" y1="430" x2="550" y2="430" stroke-width="2.5"/>
  </g>

  <!-- candado central -->
  <g transform="translate(325,275)" stroke="#E8792A" stroke-width="4" fill="none">
    <rect x="0" y="18" width="50" height="38" rx="5" fill="#ffffff"/>
    <path d="M8 18 L8 2 Q8 -16 25 -16 Q42 -16 42 2 L42 18"/>
    <circle cx="25" cy="36" r="5" fill="#E8792A" stroke="none"/>
  </g>

  <!-- letrero colgado "vuelve pronto" -->
  <g transform="translate(220,480) rotate(-3)">
    <rect x="0" y="0" width="260" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="130" y="33" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#1a1a1a" text-anchor="middle">VOLVEMOS PRONTO</text>
  </g>

  <!-- letrero 503 -->
  <g transform="translate(480,80) rotate(-4)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="65" y="40" font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#E8792A" text-anchor="middle">503</text>
  </g>

  <!-- llave inglesa de mantenimiento -->
  <g transform="translate(90,320) rotate(-25)" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linejoin="round">
    <circle cx="15" cy="15" r="16" fill="none"/>
    <path d="M4 4 L-10 -10" stroke-width="6"/>
    <rect x="10" y="60" width="10" height="70" rx="4" fill="#1a1a1a" opacity="0.06"/>
    <line x1="15" y1="31" x2="15" y2="130" stroke-width="8"/>
  </g>
</svg>
